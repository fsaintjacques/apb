syntax = "proto3";

package fixtures;

import "apb.proto";
import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";

// Scalar-only payload.
message OrderPlaced {
  string order_id = 1;
  int64 amount_cents = 2;
}

// Payload exercising inner-plan reuse: well-known type + nested message.
message RequestContext {
  google.protobuf.Timestamp received_at = 1;
  string trace_id = 2;
  Origin origin = 3;
}

message Origin {
  string service = 1;
  int32 region = 2;
}

// Envelope: metadata columns, two packed Any fields, one raw Any.
message Envelope {
  string event_id = 1;
  google.protobuf.Timestamp created_at = 2;
  google.protobuf.Any payload = 3 [(apb.apb).any_pack = "fixtures.OrderPlaced"];
  google.protobuf.Any context = 4 [(apb.apb).any_pack = "fixtures.RequestContext"];
  google.protobuf.Any raw = 5;
  repeated google.protobuf.Any events = 6 [(apb.apb).any_pack = "fixtures.OrderPlaced"];
}

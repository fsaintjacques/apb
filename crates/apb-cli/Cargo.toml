[package]
name = "apb-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI for transcoding Arrow data to Protobuf messages (apb)"

[[bin]]
name = "apb"
path = "src/main.rs"

[features]
duckdb = ["dep:duckdb"]
duckdb-bundled = ["duckdb", "dep:duckdb", "duckdb/bundled"]

[dependencies]
apb-core = { path = "../apb-core", version = "1.2.0" }
arrow-ipc = "58"
arrow-schema = "58"
clap = { version = "4", features = ["derive"] }
duckdb = { version = "1", optional = true }
prost-reflect = { version = "0.14", features = ["serde"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
arrow-array = "58"
arrow-buffer = "58"

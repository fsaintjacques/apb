[package]
name = "apb-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Arrow to Protobuf transcoding via dynamic binary descriptors — no code generation"

[dependencies]
arrow-array = "58"
arrow-buffer = "58"
arrow-schema = "58"
prost = "0.13"
prost-types = "0.13"
prost-reflect = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

